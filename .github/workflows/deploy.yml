name: Deploy a producción

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 157.245.140.77
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: bash /opt/uberloxa/app/scripts/deploy.sh
