<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" role="img" aria-label="UberLoxa - Taxi">
  <defs>
    <!-- Fondo: azul de marca (blue-600 -> blue-800) -->
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <!-- Carroceria: amarillo taxi (amber-300 -> amber-500) -->
    <linearGradient id="body" x1="24" y1="15" x2="24" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Vidrio -->
    <linearGradient id="glass" x1="24" y1="16" x2="24" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>

  <!-- Placa redondeada -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>

  <!-- Sombra del vehiculo -->
  <ellipse cx="24" cy="34" rx="15" ry="2" fill="#0F172A" opacity="0.18"/>

  <!-- Cartel TAXI en el techo -->
  <rect x="20.8" y="12.4" width="6.4" height="3.8" rx="0.9" fill="#FFFFFF" stroke="#1F2937" stroke-width="0.5"/>
  <text x="24" y="15.25" font-family="Arial, sans-serif" font-size="2.7" font-weight="700" fill="#1F2937" text-anchor="middle">TAXI</text>

  <!-- Carroceria (silueta lateral) -->
  <path d="M7 30 L8.4 23.6 Q8.7 22.6 10.2 22.4 L16 21.9 L18.6 16.9 Q19.1 16 20.1 16 L27 16 Q28.2 16 28.9 16.9 L31.4 21.9 L40 22.7 Q42 23 42 25.3 L42 29.2 Q42 30 41 30 Z"
        fill="url(#body)" stroke="#D97706" stroke-width="0.4"/>

  <!-- Ventanas -->
  <path d="M19.5 21.1 L20.5 17.3 L23.3 17.3 L23.3 21.1 Z" fill="url(#glass)"/>
  <path d="M24.7 17.3 L27.5 17.3 L28.9 21.1 L24.7 21.1 Z" fill="url(#glass)"/>

  <!-- Franja a cuadros (damero de taxi) -->
  <rect x="19.9" y="25.2" width="10.8" height="3.2" fill="#FFFFFF"/>
  <g fill="#1F2937">
    <rect x="20.0" y="25.2" width="1.5" height="1.6"/>
    <rect x="23.0" y="25.2" width="1.5" height="1.6"/>
    <rect x="26.0" y="25.2" width="1.5" height="1.6"/>
    <rect x="29.0" y="25.2" width="1.5" height="1.6"/>
    <rect x="21.5" y="26.8" width="1.5" height="1.6"/>
    <rect x="24.5" y="26.8" width="1.5" height="1.6"/>
    <rect x="27.5" y="26.8" width="1.5" height="1.6"/>
  </g>

  <!-- Faros -->
  <rect x="40.1" y="25.4" width="1.7" height="2" rx="0.6" fill="#FFFFFF"/>
  <rect x="7.1" y="24.3" width="1.4" height="1.8" rx="0.5" fill="#EF4444"/>

  <!-- Ruedas -->
  <g>
    <circle cx="16" cy="30.2" r="3.9" fill="#1F2937"/>
    <circle cx="16" cy="30.2" r="1.9" fill="#E5E7EB"/>
    <circle cx="16" cy="30.2" r="0.7" fill="#94A3B8"/>
  </g>
  <g>
    <circle cx="34" cy="30.2" r="3.9" fill="#1F2937"/>
    <circle cx="34" cy="30.2" r="1.9" fill="#E5E7EB"/>
    <circle cx="34" cy="30.2" r="0.7" fill="#94A3B8"/>
  </g>
</svg>
